---
# see https://blog.trifork.com/2013/04/02/ansible-example-playbook-to-setup-jenkins-slave/

# as root
# ansible-playbook jenkins-slave.yml -i hosts-albandri -vvvv
# as albandri
# ansible-playbook jenkins-slave.yml -i hosts-albandri -vvvv --ask-become-pass
# --extra-vars "jenkins_username=aandrieu jenkins_password=tbd"

- name: Set hostname
  ansible.builtin.import_playbook: hostname.yml

- name: Apply common configuration to all nodes
  hosts: jenkins-slaves
  become: true
  remote_user: root

  roles:
    - albanandrieu.ansible_common

  vars:
    apt_install_packages_list:
    stats_enabled: false
    utilities_enabled: false
    editors_enabled: true
    cowsay_enabled: true
    perl_enabled: false
    python_enabled: true

- name: Copy the role to build image
  hosts: jenkins-slaves
  become: true
  tasks:
    - name: Copy build.sh
      ansible.builtin.copy:
        src: roles/albanandrieu.jenkins_slave
        dest: ./
        mode: "0755"

- name: Build docker image if required. Path should contains Dockerfile to build image
  hosts: jenkins-slaves
  become: true
  tasks:
    - name: Check or build image
      community.docker.docker_image:
        name: "nabla/ansible-jenkins-slave"
        build:
          path: "/home/vagrant"
        source: build
        state: present

- name: Run docker containers
  hosts: jenkins-slaves
  become: true
  tasks:
    - name: Run docker containers
      community.docker.docker_container:
        docker_host: tcp://127.0.0.1:4243
        image: "{{ docker_image_name }}"
        name: "jenkins-slaves-{{ item }}"
        state: present
        publish_all_ports: true
      delegate_to: localhost
      with_sequence: count=2
