---
# Install OpenJDK (replaces the Oracle Java installers, removed from Ubuntu PPAs)
# ansible-playbook -i ./inventory/production -v playbooks/java.yml --limit test3.albandrieu.com --ask-become-pass

- name: Check supported distributions
  hosts: all
  gather_facts: true
  gather_subset:
    - min
  tasks:
    - name: Fail for unsupported distribution
      ansible.builtin.assert:
        that: >-
          (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in ['22.04', '24.04'])
          or (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] in ['8', '9'])
        fail_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not supported.
          Supported OSes are Ubuntu 22.04/24.04 and Red Hat Enterprise Linux (or Rocky, AlmaLinux, CentOS Stream) 8/9.

- name: Install OpenJDK
  hosts: all
  become: true
  vars:
    java_version: "21"
  tasks:
    - name: Install OpenJDK (Ubuntu)
      ansible.builtin.apt:
        name: "openjdk-{{ java_version }}-jdk-headless"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install OpenJDK (RedHat)
      ansible.builtin.dnf:
        name: "java-{{ java_version }}-openjdk-devel"
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
