# https://github.com/openclaw/openclaw-ansible/blob/main/roles/openclaw/tasks/docker-linux.yml
- name: Install Docker CE from the official repository
  hosts: Ubuntu-*
  become: true
  vars:
    docker_group_users:
      - albandrieu
  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_group_users }}"

    - name: Reset SSH connection to apply docker group
      ansible.builtin.meta: reset_connection
