- name: Remove ubuntu image
  hosts: docker-cleaning
  become: true

  tasks:
    - name: Remove ubuntu image
      community.docker.docker_image:
        state: absent
        name: ubuntu:14.04
      ignore_errors: true

    - name: Remove hello-world image
      community.docker.docker_image:
        state: absent
        name: hello-world:latest
        force_absent: true

    #    - name: Remove test image
    #      docker_image:
    #        state: absent
    #        name: docker.hub/nabla/ansible-jenkins-slave
    #        tag: test

    # For issue : Error pulling: too many links
    - name: Remove untagged images
      ansible.builtin.shell: 'docker rmi $(docker images | grep "<none>" | awk '' { print $3} '')'
      changed_when: false
      ignore_errors: true

    # TODO http://blog.yohanliyanage.com/2015/05/docker-clean-up-after-yourself/
    # TODD must be run on a daily basis
    # Clean 1 week old containers
    # docker ps -a | grep 'weeks ago' | awk '{print $1}' | xargs --no-run-if-empty docker rm
    # Clean all containers
    # docker rm `docker ps --no-trunc -aq`

    - name: Clean all exited containers
      ansible.builtin.shell: "docker rm -v $(docker ps -a -q -f status=exited)"
      changed_when: false
      ignore_errors: true

    - name: Clean all created containers
      ansible.builtin.shell: "docker rm -v $(docker ps -a -q -f status=created)"
      changed_when: false
      ignore_errors: true

    - name: Clean all created network
      ansible.builtin.shell: "docker network rm $(docker network ls | tail -n+2 | awk '{if($2 !~ /bridge|none|host/){ print $1 }}')"
      changed_when: false
      ignore_errors: true

    # TODO below is so slow, we have to pull all the images again after
    - name: Remove reclaimable images and volumes
      ansible.builtin.command: "docker system prune -a --volumes -f"
      changed_when: false
      ignore_errors: true

- name: Import docker-cleaning
  ansible.builtin.import_playbook: docker-cleaning.yml
