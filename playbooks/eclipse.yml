---
# ansible-playbook -i inventory/hosts-albandrieu -c local -v playbooks/eclipse.yml -vvvv --limit albandrieu --ask-become-pass | tee setup.log

- name: Install eclipse
  #  connection: local
  hosts: eclipse
  remote_user: albandrieu
  #  remote_user: root
  #  accelerate: true

  roles:
    - albanandrieu.eclipse

  vars:
    docker_files_enable: false
    docker_files_generated_directory: "../roles/albanandrieu.eclipse"
    eclipse_dir_tmp: "/tmp"
    # eclipse_owner: albandrieu
    eclipse_group: docker
    eclipse_plugins_emf_enabled: false
    eclipse_plugins_cdt_enabled: false
    eclipse_plugins_cmakeed_enabled: false
    eclipse_plugins_openinterminal_enabled: false
    eclipse_plugins_protobuf_enabled: false
    eclipse_plugins_yedit_enabled: false
    eclipse_plugins_shelled_enabled: false
    eclipse_plugins_webpageed_enabled: false
    eclipse_plugins_pydev_enabled: false
    eclipse_plugins_m2e_enabled: false
    eclipse_plugins_subclipse_enabled: false
    # eclipse_base_dir: "/workspace/eclipse"
    # eclipse_owner: "{{ user }}"
    # eclipse_group: "{{ eclipse_owner }}"
    # eclipse_owner_home: "{{ home }}"
