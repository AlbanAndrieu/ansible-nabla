- name: Apply hardware
  hosts: all
  gather_facts: true
  gather_subset:
    - hardware
  tasks:
    - name: Group hosts by distribution
      ansible.builtin.group_by:
        key: "{{ ansible_distribution }}-{{ ansible_distribution_version }}"
- name: Group hosts for supported distributions
  hosts: RedHat-7*:RedHat-6*:RedHat-5*:CentOS-7*:CentOS-6*:Ubuntu-21*:Ubuntu-20*:Ubuntu-19*:Ubuntu-18*:Ubuntu-17*:Ubuntu-16*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  gather_facts: false
  tasks:
    - name: Group hosts for supported distributions
      ansible.builtin.group_by:
        key: "supported"
- name: Fail on unsupported distributions
  hosts: "!supported"
  gather_facts: false
  tasks:
    - name: Fail for unsupported distribution
      ansible.builtin.fail:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} is not a supported OS for a Tower installation.  Supported OSes include Red Hat Enterprise
          Linux 6/7, CentOS 6/7, or Ubuntu 12.04/13.04/14.04/16.04/17.04/18.04/19.04."
    - name: Show distribution
      ansible.builtin.debug:
        msg: "Version {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}"

