---
- name: Install jmeter
  connection: local
  hosts: workstation

  roles:
    - role: albanandrieu.zap

  vars:
    jmeter_plugins_standard_enabled: true
    jmeter_plugins_extras_enabled: true
    jmeter_plugins_extraslibs_enabled: true
    jmeter_plugins_webdriver_enabled: true
    jmeter_plugins_hadoop_enabled: false
    jmeter_serveragent_enabled: true
