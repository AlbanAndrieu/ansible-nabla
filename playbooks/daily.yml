---
- name: Daily checks
  hosts: "{{ hosts | default([]) }}" # target with -e hosts=..., no host by default
  become: true

  tasks:
    - name: Get disk usage
      ansible.builtin.command: df -h
      register: disk_usage
      changed_when: false

    - name: Check disk space available
      ansible.builtin.shell: set -o pipefail && df -h / | awk 'NR==2 {print $5}'
      args:
        executable: /bin/bash
      register: disk_usage
      changed_when: false

    # Send Discord message when disk space is over 80%
    # - name: Send Discord message
    #   uri:
    #     url: "{{ discord_webhook_url }}"
    #     method: POST
    #     body_format: json
    #     body: '{"content": "Disk space on {{ inventory_hostname }} is above 80%!"}'
    #     headers:
    #       Content-Type: application/json
    #     status_code: 204
    #   when: disk_usage.stdout[:-1]|int > 80

    # - name: Prune non-dangling, and dangling images
    #   community.docker.docker_prune:
    #     containers: false
    #     images: true
    #     images_filters:
    #       dangling: false
    #     networks: false
    #     volumes: false
    #     builder_cache: false

    # Upgrade packages
    - name: Upgrade apt packages
      become: true
      ansible.builtin.apt:
        upgrade: true
        update_cache: true

    # Check if reboot is required
    - name: Check if system reboot is required
      become: true
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Send Discord message when reboot is required
    - name: Send Discord message
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body: '{"content": "Reboot required on {{ inventory_hostname }}"}'
        headers:
          Content-Type: application/json
        status_code: 204
      when: reboot_required.stat.exists
