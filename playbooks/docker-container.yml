    - name: Start all containers
      community.docker.docker_compose_v2:
        project_src: "{{ repository_target_dir }}/dockerfile-nabla/centos"
        files:
          - docker-compose-nabla.yml
        #        build: always
        pull: always
        # recreate: always
        recreate: auto
        project_name: "TEST"
        # remove_images: local
        # remove_orphans: true
        # remove_volumes: true
        state: present
        timeout: 180
      register: output

    - name: Show compose output
      ansible.builtin.debug:
        var: output

    - name: Check test and nabla services are running
      ansible.builtin.assert:
        that:
          - output.containers | selectattr('Service', 'equalto', item) | map(attribute='State') | first == 'running'
      loop:
        - test
        - nabla

    #    - name: "Wait for services to start"
    #      pause: minutes=15

    - name: Sleep for 900 seconds (15 minutes) and continue with play
      ansible.builtin.wait_for:
        timeout: "900"
      delegate_to: localhost

    # curl -XGET http://localhost:5601/

    - name: "Check the status of kibana UI"
      ansible.builtin.uri:
        url: http://localhost:5601/
        return_content: true
      register: curl_result

    - name: "Ensure that proper data is present in stdout"
      ansible.builtin.assert:
        that:
          - "'Kibana 4' in curl_result.content"
      ignore_errors: true

    # TODO
