- name: Define WORKSPACE
  hosts: docker-container
  #  become: true

  tasks:
    #    - name: Log into private registry
    #      docker_login:
    #        registry: https://docker.nabla.mobi/
    #        username: nabla
    #        password: "{{ vault_docker_registry_password }}"
    #        state: present
    #        debug: true
    ##        reauthorize: yes
    ##        ignore_errors: true

    - name: Define WORKSPACE
      ansible.builtin.shell: "echo $WORKSPACE"
      environment:
        WORKSPACE: "{{ repository_target_dir }}"
      changed_when: false

    - name: Echo WORKSPACE again
      ansible.builtin.shell: "echo $WORKSPACE"
      changed_when: false

    - name: Copy the code from repository
      ansible.builtin.git:
        repo: "{{ repository }}"
        version: "{{ repository_version }}"
        dest: "{{ repository_target_dir }}/dockerfile-fusionrisk"
      become: true
      become_user: "{{ git_user }}"
    #      ignore_errors: true

    #    - name: Sync .env file
    #      synchronize:
    #        src: "{{ repository_target_dir }}/dockerfile-nabla/centos/.env"
    #        dest: "{{ repository_target_dir }}/dockerfile-nabla/.env"
    #      #delegate_to: delegate.host
    #      #delegate_to: localhost
    #      delegate_to: "{{ inventory_hostname }}"

    # See https://docs.ansible.com/ansible/latest/collections/community/docker/docker_compose_v2_module.html
    - name: Stop all containers
      community.docker.docker_compose_v2:
        project_src: "{{ repository_target_dir }}/dockerfile-nabla/centos"
        files:
          - docker-compose.yml
        build: never
        recreate: never
        project_name: "TEST"
        remove_images: local
        remove_orphans: true
        remove_volumes: true
        state: absent
        #        pull: always
        #        timeout: 120
      register: output
      ignore_errors: true

    - name: Show compose output
      ansible.builtin.debug:
        var: output

- name: Import docker-registry
  ansible.builtin.import_playbook: docker-registry.yml

- name: Create a data container
  hosts: docker-container
  #  become: true

  tasks:
    - name: Create a data container
      community.docker.docker_container:
        name: mydata
        image: busybox
        volumes:
          - /data

    - name: Container present (ubuntu:16.04)
      community.docker.docker_container:
        name: ubuntu1604
        state: present
        image: ubuntu:16.04
        command: sleep infinity

    - name: Container present (ubuntu:18.04)
      community.docker.docker_container:
        name: ubuntu1804
        state: present
        image: ubuntu:18.04
        command: sleep infinity

