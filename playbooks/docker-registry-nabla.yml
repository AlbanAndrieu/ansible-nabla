---
# ansible-playbook -i production -c local -v docker-registry-fusionrisk.yml --ask-pass -vvvv | tee setup.log
# ansible-playbook -i production -c local -v docker-registry-fusionrisk.yml --limit albandri.albandrieu.com --ask-become-pass -vvvv | tee setup.log

- name: Group hosts by distribution
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by distribution
      ansible.builtin.group_by:
        key: "{{ ansible_distribution }}-{{ ansible_distribution_version }}"
- name: Group hosts for supported distributions
  hosts: RedHat-7*:RedHat-6*:RedHat-5*:CentOS-7*:CentOS-6*:Ubuntu-17*:Ubuntu-16*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  gather_facts: false
  tasks:
    - name: Group hosts for supported distributions
      ansible.builtin.group_by:
        key: "supported"
- name: Fail on unsupported distributions
  hosts: "!supported"
  gather_facts: false
  tasks:
    - name: Fail for unsupported distribution
      ansible.builtin.fail:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} is not a supported OS for a Tower installation.  Supported OSes include Red Hat Enterprise
          Linux 6/7, CentOS 6, or Ubuntu 12.04/13.04/14.04/16.04/17.04."
    - name: Show distribution
      ansible.builtin.debug:
        msg: "Version {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}"

- name: Define DOCKER_CLIENT_TIMEOUT
  hosts: docker-container
  #  become: true

  tasks:
    - name: Define DOCKER_CLIENT_TIMEOUT
      ansible.builtin.shell: "echo $DOCKER_CLIENT_TIMEOUT"
      environment:
        DOCKER_CLIENT_TIMEOUT: "240"
      changed_when: false

    - name: Echo DOCKER_CLIENT_TIMEOUT again
      ansible.builtin.shell: "echo $DOCKER_CLIENT_TIMEOUT"
      changed_when: false

    - name: Define COMPOSE_HTTP_TIMEOUT
      ansible.builtin.shell: "echo $COMPOSE_HTTP_TIMEOUT"
      environment:
        COMPOSE_HTTP_TIMEOUT: "2000"
      changed_when: false

    - name: Echo COMPOSE_HTTP_TIMEOUT again
      ansible.builtin.shell: "echo $COMPOSE_HTTP_TIMEOUT"
      changed_when: false

- name: Inspect multiple images
  hosts: docker-container
  become: true

  tasks:
    #    - name: Log into private registry and force re-authorization
    #      docker_login:
    #        registry: https://docker.nabla.mobi/
    #        username: nabla
    #        password: "{{ vault_docker_registry_password }}"
    #        reauthorize: yes

    - name: Inspect multiple images
      community.docker.docker_image_info:
        name:
          - nabla/centos
          - nabla/java

- name: Pull ansible-jenkins-slave images
  hosts: docker-container
  #  become: true

  tasks:
    - name: Pull ansible-jenkins-slave images
      community.docker.docker_container:
        name: ansible-jenkins-slave
        image: registry.nabla.mobi/fusion-risk/ansible-jenkins-slave
        state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull zaproxy images
      community.docker.docker_container:
        name: zap2docker-stable
        image: owasp/zap2docker-stable
        state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull centos images
      community.docker.docker_container:
        name: centos
        image: docker/nabla/centos:6.8-latest
        state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull selenium hub images
      community.docker.docker_container:
        name: selenium-hub
        image: selenium/hub
        # state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull selenium chrome images
      community.docker.docker_container:
        name: selenium-node-chrome
        image: selenium/node-chrome
        state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull selenium standalone chrome images
      community.docker.docker_container:
        name: selenium-standalone-chrome-debug
        image: selenium/standalone-chrome-debug
        state: stopped
        pull: true
        # command: sleep infinity

    - name: Pull selenium standalone firefox images
      community.docker.docker_container:
        name: selenium-standalone-firefox-debug
        image: selenium/standalone-firefox-debug
        state: stopped
        pull: true
        # command: sleep infinity
