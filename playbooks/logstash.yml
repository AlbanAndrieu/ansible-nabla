- name: Add elasticsearch curator
  hosts: logstash
  remote_user: root
  #  connection: local

  roles:
    - geerlingguy.elasticsearch-curator

- name: Add logstash configuration
  hosts: logstash
  remote_user: root
  #  connection: local

  roles:
    - albanandrieu.logstash-settings

  vars:
    logstash_monitor_local_collectd: true
    logstash_listen_port_lumberjack: 6000
    #logstash_elasticsearch_host: "albandri"
    #logstash_local_syslog_path: "/var/log/*.log"
    logstash_monitor_local_syslog: true
    logstash_monitor_collectd_syslog: true
    logstash_monitor_jenkins_enabled: true
    logstash_monitor_nexus_enabled: true
    logstash_monitor_apache_enabled: true
    logstash_monitor_nginx_enabled: true
    logstash_monitor_tomcat_enabled: true
    logstash_monitor_jetty_enabled: true
    logstash_monitor_redis_enabled: false
    logstash_monitor_jboss_enabled: true
    logstash_monitor_elasticsearch_enabled: true
    logstash_monitor_miscellaneous_enabled: true
    logstash_monitor_application_enabled: true
    logstash_monitor_sybase_enabled: true
    logstash_monitor_log4j_enabled: false
    logstash_heap: "50m"
    redis_bind_interface: "127.0.0.1"
    elasticsearch_plugin_hq: true
    jenkins_home: /var/lib/jenkins
    application_dir: "/thomsonreuters"
    application_user: "albandri"
    application_name: "nabla"
    sybase_log_file: "NABLA.log"
    tomcat_catalina_base_dir: "{{ application_home }}"
    tomcat_catalina_out: "{{ application_home }}/log/catalina.out"
    tomcat_catalina_log_dir: "{{ tomcat_catalina_base_dir }}/data/J2EE/TomcatConfigs/logs"
    collectd_prefix: "/etc/collectd"
    collectd_type: false
    collectd_prefix_type: "/usr/share/collectd/"
    collectd_prefix_conf: "{{ collectd_prefix }}"
    nginx_worker_processes: "8"
    nginx_worker_connections: "8192"
    nginx_user: root
    #       kibana_elasticsearch_url: ""
    kibana_username: kibana
    kibana_password: microsoft
    kibana_domain: home.nabla.mobi
    kibana_server_name: home.nabla.mobi
    es_address: http://{{ kibana_domain}}/es/
