---
# Install the /opt/ansible/env python virtualenv with requirements-current.txt
# ansible-playbook -i inventory/production playbooks/python.yml --limit albandri

- name: Check supported distributions
  hosts: all
  gather_facts: true
  gather_subset: min
  tasks:
    - name: Fail for unsupported distribution
      ansible.builtin.assert:
        that: >-
          (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] in ['22.04', '24.04'])
          or (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] in ['8', '9'])
        fail_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not supported.
          Supported OSes are Ubuntu 22.04/24.04 and Red Hat Enterprise Linux (or Rocky, AlmaLinux, CentOS Stream) 8/9.

- name: Install python virtualenv
  hosts: all
  become: true
  vars:
    python_version: "3.12"
    python_venv_path: /opt/ansible/env
    python_venv_owner: ansible
    python_venv_group: docker
  tasks:
    # python3-packaging is needed by the pip module on the system python
    - name: Install prerequisites (Ubuntu)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - python3-packaging
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Add deadsnakes PPA for python (Ubuntu 22.04)
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - ansible_facts['distribution_version'] is version('24.04', '<')

    - name: Install python (Ubuntu)
      ansible.builtin.apt:
        name:
          - "python{{ python_version }}"
          - "python{{ python_version }}-dev"
          - "python{{ python_version }}-venv"
          - build-essential
          - libmagic1
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install python (RedHat)
      ansible.builtin.dnf:
        name:
          - "python{{ python_version }}"
          - "python{{ python_version }}-devel"
          - gcc
          - file-libs
          - python3-packaging
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Create virtualenv directory
      ansible.builtin.file:
        path: "{{ python_venv_path | dirname }}"
        state: directory
        owner: "{{ python_venv_owner }}"
        group: "{{ python_venv_group }}"
        mode: "0775"
      tags:
        - venv

    - name: Copy python requirements
      ansible.builtin.copy:
        src: python/requirements-current.txt
        dest: "{{ python_venv_path | dirname }}/requirements-current.txt"
        owner: "{{ python_venv_owner }}"
        group: "{{ python_venv_group }}"
        mode: "0644"
      tags:
        - venv
        - requirements

    - name: Create virtualenv and install requirements
      ansible.builtin.pip:
        requirements: "{{ python_venv_path | dirname }}/requirements-current.txt"
        virtualenv: "{{ python_venv_path }}"
        virtualenv_command: "python{{ python_version }} -m venv"
      tags:
        - venv
        - requirements

    - name: Fix permission on virtualenv
      ansible.builtin.file:
        path: "{{ python_venv_path }}"
        state: directory
        owner: "{{ python_venv_owner }}"
        group: "{{ python_venv_group }}"
        mode: "g+rwX"
        recurse: true
      tags:
        - venv
        - requirements
