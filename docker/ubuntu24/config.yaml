---
schemaVersion: "2.0.0"

globalEnvVars:
  - key: "JAVA_HOME"
    value: "/usr/lib/jvm/java-1.21.0-openjdk-amd64"

fileExistenceTests:
  - name: "Root"
    path: "/"
    shouldExist: true
    permissions: "drwxr-xr-x"
    uid: 0
    gid: 0
    isExecutableBy: "group"

  - name: "entrypoint"
    path: "/usr/local/bin/dockerd-entrypoint.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"
    uid: 0
    gid: 0

  - name: "modprobe"
    path: "/usr/local/bin/modprobe"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "container-structure-test"
    path: "/usr/local/bin/container-structure-test"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  # PYTHON virtualenv (python3.14 from the selenium base image)

  - name: "python virtualenv"
    path: "/opt/venv"
    shouldExist: true
    permissions: "drwxr-xr-x"
    uid: 1000

  - name: "pip virtualenv"
    path: "/opt/venv/bin/pip"
    shouldExist: true

  - name: "pip local"
    path: "/usr/local/bin/pip"
    shouldExist: false

  - name: "python 3"
    path: "/usr/bin/python3"
    shouldExist: true
    permissions: "Lrwxrwxrwx"

  - name: "python"
    path: "/usr/bin/python"
    shouldExist: true
    permissions: "Lrwxrwxrwx"

  # PYTHON pip cache cleaned (to spare disk space)

  - name: "home .cache pip"
    path: "/home/ubuntu/.cache/pip"
    shouldExist: false

  # NODE

  - name: "npm"
    path: "/usr/bin/npm"
    shouldExist: true
    permissions: "Lrwxrwxrwx"

  - name: "node"
    path: "/usr/bin/node"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "jest"
    path: "/usr/bin/jest"
    shouldExist: true
    permissions: "Lrwxrwxrwx"

  - name: "dockerfile_lint"
    path: "/usr/bin/dockerfile_lint"
    shouldExist: true
    permissions: "Lrwxrwxrwx"

  - name: "docker credentials"
    path: "/home/ubuntu/.docker/config.json"
    shouldExist: false

  - name: "home .config configstore"
    path: "/home/ubuntu/.config/configstore"
    shouldExist: false

  - name: "tmp"
    path: "/tmp"
    shouldExist: true
    permissions: "dtrwxrwxrwx"

  - name: "java-1.21.0-openjdk-amd64"
    path: "/usr/lib/jvm/java-1.21.0-openjdk-amd64/"
    shouldExist: true

  # Removed from the image
  - name: "php"
    path: "/usr/bin/php"
    shouldExist: false

  - name: "nomad"
    path: "/bin/nomad"
    shouldExist: false

commandTests:
  - name: "check PATH"
    command: "bash"
    args: ["-c", "echo ${PATH}"]
    expectedOutput:
      [
        "/home/ubuntu/go/bin:/usr/local/go/bin:/opt/venv/bin:/home/seluser/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
      ]

  - name: "check git version"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version 2.43.*"]

  - name: "check node v24 version"
    command: "node"
    args: ["--version"]
    expectedOutput: ["v24\\..*"]

  - name: "check npm 11.21 version"
    command: "npm"
    args: ["--version"]
    expectedOutput: ["11\\.21\\..*"]

  - name: "check newman 5.2 version"
    command: "newman"
    args: ["--version"]
    expectedOutput: ["5\\.2\\..*"]

  - name: "check jest 28.1 version"
    command: "jest"
    args: ["--version"]
    expectedOutput: ["28\\.1\\..*"]

  - name: "check pip from virtualenv"
    command: "pip"
    args: ["--version"]
    expectedOutput: ["pip .* from /opt/venv/lib/python3\\.14/site-packages/pip .*"]

  - name: "check python 3 version"
    command: "python3"
    args: ["--version"]
    expectedOutput: ["Python 3\\.14\\..*"]

  - name: "check python version"
    command: "python"
    args: ["--version"]
    expectedOutput: ["Python 3\\.14\\..*"]

  - name: "check ansible core 2.21 version"
    command: "ansible"
    args: ["--version"]
    expectedOutput: ["ansible .*core 2\\.21\\..*"]

  - name: "check ansible-lint 26 version"
    command: "ansible-lint"
    args: ["--version"]
    expectedOutput: ["ansible-lint .*26\\..*"]

  - name: "check docker 29.9 version"
    command: "docker"
    args: ["--version"]
    expectedOutput: ["Docker version 29\\.9\\..*"]

  - name: "check docker compose plugin"
    command: "docker"
    args: ["compose", "version"]
    expectedOutput: ["Docker Compose version v.*"]

  - name: "check aws 1.46 version"
    command: "aws"
    args: ["--version"]
    expectedOutput: ["aws-cli/1\\.46\\..*"]

  - name: "check go 1.27 version"
    command: "go"
    args: ["version"]
    expectedOutput: ["go version go1\\.27\\..*"]

  - name: "check trivy 0.76 version"
    command: "trivy"
    args: ["--version"]
    expectedOutput: ["Version: 0\\.76\\..*"]

  - name: "check container-structure-test 1.22 version"
    command: "container-structure-test"
    args: ["version"]
    expectedOutput: [".*1\\.22\\..*"]

  - name: "check java 21 version"
    command: "java"
    args: ["-version"]
    expectedError: ["openjdk version \"21\\..*"]

metadataTest:
  envVars:
    - key: TZ
      value: "Europe/Paris"
    - key: "VIRTUAL_ENV"
      value: "/opt/venv"
  labels:
    - key: "vendor"
      value: "nabla"
  exposedPorts: ["2375", "2376"]
  volumes: ["/var/lib/docker"]
  entrypoint: [dockerd-entrypoint.sh]
  cmd: ["/bin/bash"]
  workdir: "/tmp"
